[project]
name = "reto1-vanilla"
version = "0.1.0"
description = "Quantathon CR 2026 - Challenge 1: fault-zone partitioning of a power grid as Max-Cut, solved with QAOA on Quantinuum's H2 emulator and benchmarked honestly against classical baselines (exact, Goemans-Williamson, greedy, simulated annealing)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "cvxpy>=1.6",
    "matplotlib>=3.9",
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "pytket>=2.0",
    "pytket-qiskit>=0.60",
    "qnexus>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reto1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
